# Docker Compose production-sandbox override using gVisor (runsc).
# Prerequisite: Install gVisor (`runsc`) and register it in /etc/docker/daemon.json.
# Usage: docker compose -f docker-compose.yml -f infrastructure/sandbox/docker-compose.gvisor.yml up -d
services:
  scanner-runner:
    runtime: runsc
    environment:
      SCANNER_SANDBOX_RUNTIME: gvisor
    security_opt:
      - no-new-privileges:true
      - seccomp=./infrastructure/sandbox/seccomp-scanner.json
