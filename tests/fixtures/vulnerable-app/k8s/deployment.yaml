apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-demo-app
  template:
    metadata:
      labels:
        app: insecure-demo-app
    spec:
      hostPID: true
      containers:
        - name: web
          image: nginx:latest
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
