name: Deploy Pipeline (Deliberately Vulnerable Fixture)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  id-token: write
  contents: write

jobs:
  consume-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Download upstream artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-deploy
          aws-region: us-east-1

      - name: Echo secret directly
        run: echo "Deploying with ${{ secrets.DEPLOY_TOKEN }}"

  legacy-static-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Static AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

  call-external:
    uses: external-org/shared-workflows/.github/workflows/release.yml@main
    secrets: inherit
