name: Bug Report
description: Report a bug, false positive, or false negative in Indicative
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Do NOT report security vulnerabilities here.** Use GitHub Private Vulnerability Reporting per `SECURITY.md`."
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Clear summary of the bug or detection accuracy issue.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Fixture / Steps
      description: Provide sanitized fixture code or workflow YAML (NEVER include real credentials).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node.js version, OS, Docker/Compose or native, scanner versions"
